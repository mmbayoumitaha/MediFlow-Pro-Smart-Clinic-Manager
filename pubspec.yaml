name: mediflow
description: "MediFlow Pro — Smart Clinic Manager demo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'

dependencies:
  flutter:
    sdk: flutter
  # Flutter's adaptive Material widgets can reference this bundled icon font.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  intl: ^0.20.3
  uuid: ^4.5.1
  characters: ^1.4.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
