name: mediflow
description: "MediFlow Pro — Complete Clinic & Medical Center Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  animations: ^2.0.11
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1

  # Utilities
  intl: ^0.20.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^9.2.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0

  # PDF Generation
  pdf: ^3.11.2
  printing: ^5.14.2

  # Local Storage
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Form & Validation
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.0

  # Date & Time
  table_calendar: ^3.2.0

  # Icons
  flutter_iconly: ^1.0.2
  iconsax_flutter: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  json_serializable: ^6.9.3


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

